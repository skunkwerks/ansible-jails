---
- name: set template facts
  set_fact:
    cacheable: yes
    jails_download_dir: '{{ jails_mount ~ "/downloads/" ~ [jails_target, jails_machine, jails_arch] | join("-") }}'
    jails_fetch_file:   '{{ jails_mount ~ "/downloads/" ~ [jails_target, jails_machine, jails_arch] | join("-") ~ "/" ~ jails_tarball }}'
    template_abi:       '{{ jails_abi }}'
    template_dir:       '{{ jails_mount ~ "/templates/" ~ [jails_target, jails_machine, jails_arch] | join("-") }}'
    template_etc_dir:   '{{ jails_mount ~ "/templates/" ~ [jails_target, jails_machine, jails_arch] | join("-") ~ "/etc" }}'
    template_packages:  '{{ (jails_mandatory_packages + jails_default_packages) | unique | join(" ") }}'
    # freebsd-update only supports RELEASE tarballs; base packages use pkg
    template_freebsd_update: '{{ not jails_base_pkg | bool and jails_target is search("-RELEASE$") }}'
  tags: jails, template, facts

- name: debug template facts
  debug:
    msg: |
      Dump Template Facts:
      Directories:
        jails_download_dir: {{ jails_download_dir }}
        jails_fetch_file: {{ jails_fetch_file }}
        template_dir: {{ template_dir }}
        template_etc_dir: {{ template_etc_dir }}
      Configs:
        template_abi: {{ template_abi }}
        template_packages: {{ template_packages }}
        jails_patch_template: {{ jails_patch_template | default(true) }}
        jails_verify_template: {{ jails_verify_template | default(true) }}
        jails_base_pkg: {{ jails_base_pkg }}
        template_freebsd_update: {{ template_freebsd_update }}
        jails_base_pkg_abi: {{ jails_base_pkg_abi }}
        jails_base_pkg_osversion: {{ jails_base_pkg_osversion }}
        jails_base_pkg_url: {{ jails_base_pkg_url }}
        jails_base_pkg_sets: {{ jails_base_pkg_sets | join(' ') }}
  when: ansible_verbosity > 1

- name: prepare template jail
  block:

  - name: fetch tarball without checksum
    get_url:
      url:      '{{ jails_url }}'
      dest:     '{{ jails_fetch_file }}'
    when: not jails_base_pkg and jails_tarball_sha256 is undefined
    tags: jails, template, fetch

  - name: fetch tarball with checksum
    get_url:
      url:      '{{ jails_url }}'
      dest:     '{{ jails_fetch_file }}'
      checksum: 'sha256:{{ jails_tarball_sha256 }}'
    when: not jails_base_pkg and jails_tarball_sha256 is defined
    tags: jails, template, fetch

  - name: unpack tarball into template chroot
    ansible.builtin.command:
      cmd: >
        /usr/bin/tar xpf {{ jails_fetch_file }}
        -C {{ template_dir }}
      creates: '{{ template_dir }}/.zfs/snapshot/unpacked'
    when: not jails_base_pkg
    tags: jails, template, tar

  - name: check for pkgbase signing keys on the jail host
    stat:
      path: '{{ jails_base_pkg_keys }}'
    register: base_pkg_keys
    when: jails_base_pkg
    tags: jails, template, pkgbase

  - name: fail early if pkgbase signing keys are missing
    fail:
      msg: >
        {{ jails_base_pkg_keys }} is missing on this host, so base packages
        for {{ jails_target }} cannot be verified. Set jails_base_pkg: false
        to use the tarball, or provide the keys or your own
        jails_base_pkg_repo_config.
    when: jails_base_pkg and not base_pkg_keys.stat.exists
    tags: jails, template, pkgbase

  - name: create pkgbase repo config dir
    file:
      path: '{{ jails_download_dir }}/repos'
      state: directory
      mode: 0755
    when: jails_base_pkg
    tags: jails, template, pkgbase

  - name: create pkgbase repo config for installing the template
    copy:
      content: "{{ jails_base_pkg_repo_config }}"
      dest: '{{ jails_download_dir }}/repos/{{ jails_base_pkg_repo }}.conf'
      mode: 0444
    when: jails_base_pkg
    tags: jails, template, pkgbase

  - name: copy pkgbase signing keys into template
    ansible.builtin.command:
      cmd: >
        /bin/sh -c '/bin/mkdir -p {{ template_dir }}{{ jails_base_pkg_keys | dirname }}
        && /bin/cp -Rp {{ jails_base_pkg_keys }} {{ template_dir }}{{ jails_base_pkg_keys | dirname }}/'
      creates: '{{ template_dir }}{{ jails_base_pkg_keys }}'
    when: jails_base_pkg
    tags: jails, template, pkgbase

  - name: install base system packages into template
    ansible.builtin.command:
      cmd: >
        /usr/bin/env
          ASSUME_ALWAYS_YES=yes
        /usr/local/sbin/pkg
          --rootdir {{ template_dir }}
          --repo-conf-dir {{ jails_download_dir }}/repos
          -o ABI={{ jails_base_pkg_abi }}
          -o OSVERSION={{ jails_base_pkg_osversion }}
          -o IGNORE_OSVERSION=yes
          -o PKG_CACHEDIR={{ jails_download_dir }}/cache
          install -r {{ jails_base_pkg_repo }}
          {{ jails_base_pkg_sets | join(' ') }}
      creates: '{{ template_dir }}/.zfs/snapshot/unpacked'
    no_log: "{{ ansible_verbosity < 2 }}"
    when: jails_base_pkg
    tags: jails, template, pkgbase

  - name: snapshot unpacked template
    ansible.builtin.command:
      cmd: >
        /sbin/zfs snapshot {{ jails_template }}@unpacked
      creates: '{{ template_dir }}/.zfs/snapshot/unpacked'
    tags: jails, template, tar

  - name: update template to latest patches
    ansible.builtin.command:
      cmd: >
        /usr/sbin/freebsd-update
        --currently-running {{jails_target }}
        -b {{ template_dir }}
        --not-running-from-cron fetch install
      creates: '{{ template_dir }}/.zfs/snapshot/patched'
    register: update_result
    changed_when: update_result.stdout is not regex('^No updates needed.*$')
    tags: jails, template, update
    when: template_freebsd_update and jails_patch_template | default(true)

  - name: snapshot patched template
    ansible.builtin.command:
      cmd: >
        /sbin/zfs snapshot {{ jails_template }}@patched
      creates: '{{ template_dir }}/.zfs/snapshot/patched'
    tags: jails, template, tar
    when: template_freebsd_update and jails_patch_template | default(true)

  - name: verify template integrity with IDS
    ansible.builtin.command:
      cmd: >
        /usr/sbin/freebsd-update
        --currently-running {{jails_target }}
        -b {{ template_dir }}
        IDS
      creates: '{{ template_dir }}/.zfs/snapshot/verified'
    register: ids_result
    changed_when: false
    failed_when: ids_result.rc != 0
    tags: jails, template, update
    when: template_freebsd_update and jails_verify_template | default(true)

  - name: verify template package checksums
    ansible.builtin.command:
      cmd: >
        /usr/local/sbin/pkg
          --rootdir {{ template_dir }}
          check --checksums --all
      creates: '{{ template_dir }}/.zfs/snapshot/verified'
    changed_when: false
    tags: jails, template, pkgbase
    when: jails_base_pkg and jails_verify_template | default(true)

  - name: snapshot verified template
    ansible.builtin.command:
      cmd: >
        /sbin/zfs snapshot {{ jails_template }}@verified
      creates: '{{ template_dir }}/.zfs/snapshot/verified'
    tags: jails, template, update
    # only when IDS or pkg check actually verified the template
    when: (template_freebsd_update or jails_base_pkg) and jails_verify_template | default(true)

  - name: disable services in template by default
    copy:
      dest: '{{ template_etc_dir }}/rc.conf'
      content: |
        hostname=template
        jail_host={{ inventory_hostname_short }}
        cron_enable=NO
        ntpd_enable=NO
        sendmail_enable=NONE
        sendmail_msp_queue_enable=NO
        sendmail_outbound_enable=NO
        sendmail_submit_enable=NO
        sshd_enable=NO
        syslogd_enable=NO
        syslogd_flags=-ss
        zfs_enable=YES
    tags: jails, template, services

  - name: ensure UTC in template if not set
    ansible.builtin.command:
      cmd: >
        tzsetup -s -C {{ template_dir }} UTC
      creates: '{{ template_etc_dir }}/localtime'
    tags: jails, template, timezone

  - name: set resolv.conf
    copy:
      content: "{{ jails_resolv_conf }}"
      dest: "{{ template_etc_dir }}/resolv.conf"
      mode: 0644
      owner: root
      group: wheel
    tags: jails, template, resolv

  - name: create /usr/local/etc/pkg/repos dir with correct permissions
    file:
      path: "{{ template_dir }}/usr/local/etc/pkg/repos"
      state: directory
      mode: 0755
      owner: root
      group: wheel
    tags: jails, template, facts

  - name: create ansible local facts dir
    file:
      path: "{{ template_dir }}/usr/local/etc/ansible/facts.d"
      state: directory
      mode: 0750
      owner: root
      group: wheel
    tags: jails, template, facts

  - name: create custom package repo from base system
    copy:
      content: "{{ jails_repo_config }}"
      dest: "{{ template_dir }}/usr/local/etc/pkg/repos/{{ jails_repo }}.conf"
      mode: 0400
      owner: root
      group: wheel
    tags: jails, template, pkg, repo
    when: jails_repo not in ['FreeBSD', 'FreeBSD-ports']

  - name: enable pkgbase repo inside jails for base system updates
    copy:
      content: "{{ jails_base_pkg_repo_config }}"
      dest: "{{ template_dir }}/usr/local/etc/pkg/repos/{{ jails_base_pkg_repo }}.conf"
      mode: 0444
      owner: root
      group: wheel
    tags: jails, template, pkg, repo, pkgbase
    when: jails_base_pkg

  - name: install essential packages
    ansible.builtin.command:
      cmd: >
        /usr/bin/env
          ASSUME_ALWAYS_YES=yes
          AUTOCLEAN=yes
        /usr/local/sbin/pkg
          --chroot {{ template_dir }}
          install -r {{ jails_repo }}
          -y {{ template_packages }}
      creates: '{{ template_dir }}/usr/local/bin/python3'
    no_log: "{{ ansible_verbosity < 2 }}"
    tags: jails, template, python, packages

  - name: snapshot with tweaks
    ansible.builtin.command:
      cmd: >
        /sbin/zfs snapshot {{ jails_template }}@tweaked
      creates: '{{ template_dir }}/.zfs/snapshot/tweaked'
    tags: jails, template

  - name: hook out to custom template role
    include_role:
      name: '{{ jails_template_role | default(None) }}'
    vars:
      is_template: true
    when: jails_template_role is defined
    tags: jails, template, custom

  - name: prepare final snapshot for cloning
    ansible.builtin.command:
      cmd: >
        /sbin/zfs snapshot {{ jails_template }}@ready
      creates: '{{ template_dir }}/.zfs/snapshot/ready'
    tags: jails, template, zfs

  # endblock
  when: template_missing
