---
- name: set final facts
  set_fact:
    cacheable: yes
    final_instance_name: '{{ instance_name }}'
    final_instance_groups: '{{ instance_groups | default([]) }}'
  when: instance_name is defined
  tags: instance, facts

- name: debug final facts
  debug:
    msg: |
      Dump Final Facts:
      Instance:
        final_instance_name: {{ final_instance_name | default('<unset>') }}
        final_instance_groups: {{ final_instance_groups | default('<unset>') }}
  when: ansible_verbosity > 1

- name: refresh the fact cache with groups and local facts
  ansible.builtin.include_tasks: final_refresh.yml
  when: instance_name is defined
  tags: instance, facts, debug
