---
- name: set role facts
  set_fact:
    cacheable: yes
    # datasets
    jails_ds:       "{{ jails_zpool ~ jails_mount }}" # main dataset
    jails_dss:      "{{ jails_zpool ~ jails_mount }}/" # a convenient trailing slash
    jails_download: "{{ jails_zpool ~ jails_mount ~ '/downloads/' ~ [jails_target, jails_machine, jails_arch] | join('-') }}"
    jails_template: "{{ jails_zpool ~ jails_mount ~ '/templates/' ~ [jails_target, jails_machine, jails_arch] | join('-') }}"
    # directories
    download_dir:   "{{ jails_mount ~ '/downloads/' ~ [jails_target, jails_machine, jails_arch ] | join('-') }}"
    template_dir:   "{{ jails_mount ~ '/templates/' ~ [jails_target, jails_machine, jails_arch ] | join('-') }}"
    # presence of zfs snapshot allows short-cutting the role
    template_ready: "{{ jails_mount ~ '/templates/' ~ [jails_target, jails_machine, jails_arch ] | join('-') }}/.zfs/snapshot/ready"
  tags: jails, facts

- name: set zfs facts
  set_fact:
    cacheable: yes
    jails_ds:       "{{ jails_zpool ~ jails_mount }}" # main dataset
    jails_dss:      "{{ jails_zpool ~ jails_mount }}/" # a convenient trailing slash
    jails_template: "{{ jails_zpool ~ jails_mount ~ '/templates/' ~ [jails_target, jails_machine, jails_arch] | join('-') }}"
  tags: jails, facts, zfs

- name: debug jail facts
  debug:
    msg: |
      Dump Jails Facts:
      Datasets:
        jails_ds: {{ jails_ds }}
        jails_dss: {{ jails_dss }}
        jails_download: {{ jails_download }}
        jails_template: {{ jails_template }}
      Directories:
        download_dir: {{ download_dir }}
        template_dir: {{ template_dir }}
        template_ready: {{ template_ready }}
      Configs:
        jails_zpool: {{ jails_zpool }}
        jails_mount: {{ jails_mount }}
        jails_target: {{ jails_target }}
        jails_machine: {{ jails_machine }}
        jails_arch: {{ jails_arch }}
  when: ansible_verbosity > 1

- name: check for presence of final snapshot
  stat:
    path: "{{ template_ready }}"
  register: snapshot
  tags: jails, facts

# do this the inverted way, to make when: checks in the role more usable
- name: register template unfinished flag
  set_fact:
      template_missing: true
  tags: jails, facts

- name: clear template unfinished flag if final snapshot was found
  set_fact:
      template_missing: false
  when: snapshot.stat.isdir is defined and snapshot.stat.isdir
  tags: jails, facts

- name: ensure each jail is in jail_list
  command: |
    /usr/sbin/sysrc
      -f /etc/rc.conf.d/jail
      jail_list+={{ item.name }}
  loop: "{{ jails_list }}"
  when: jails_list | length > 0
  tags: jails, daemon

- name: deploy config used for all jails
  block:
  # startblock
  - name: create main dataset
    community.general.zfs:
      name: "{{ jails_ds }}"
      state: present
      extra_zfs_properties:
        mountpoint: "{{ jails_mount }}"
        readonly: off
        atime: off
    when: template_missing
    tags: jails, zfs

  - name: create intermediary datasets
    community.general.zfs:
      name: "{{ jails_dss ~ item }}"
      state: present
      extra_zfs_properties:
        readonly: off
        canmount: off
    loop:
      - downloads
      - instances
      - templates
    when: template_missing
    tags: jails, zfs

  - name: create template dataset
    community.general.zfs:
      name: "{{ item }}"
      state: present
      extra_zfs_properties:
        readonly: off
    loop:
      - "{{ jails_download }}"
      - "{{ jails_template }}"
    when: template_missing
    tags: jails, zfs

  - name: set permissions
    file:
      path: "{{ item }}"
      state: directory
      recurse: no
      owner: root
      group: wheel
      mode: '0775'
    loop:
      - "{{ jails_mount }}"
      - "{{ jails_mount }}/downloads"
      - "{{ jails_mount }}/instances"
      - "{{ jails_mount }}/tags"
      - "{{ jails_mount }}/templates"
    when: template_missing
    tags: jails, zfs

  - name: enable loader tunables
    lineinfile:
      dest: /boot/loader.conf
      line: "{{ item }}"
    loop:
      - 'kern.racct.enable=1'
    tags: jails, loader

  - name: create global jail.conf file
    template:
      src: "{{ jails_jail_conf }}"
      dest: /etc/jail.conf
      mode: 0440
    tags: jails, daemon

  - name: create jail config dir for instances
    file:
      path: /etc/jail.conf.d
      state: directory
      mode: '0750'
    tags: jails, daemon

  - name: ensure jail_enable is set
    lineinfile:
      path: /etc/rc.conf.d/jail
      line: 'jail_enable=YES'
      regexp: '^jail_enable='
      create: yes
      mode: '0440'
    tags: jails, daemon

  # endblock
  when: template_missing

- name: prepare zfs datasets
  block:

  - name: create main dataset
    community.general.zfs:
      name: "{{ jails_ds }}"
      state: present
      extra_zfs_properties:
        mountpoint: "{{ jails_mount }}"
        readonly: off
        atime: off
    tags: jails, zfs

  - name: create intermediary datasets
    community.general.zfs:
      name: "{{ jails_dss ~ item }}"
      state: present
      extra_zfs_properties:
        readonly: off
        canmount: off
    loop:
      - downloads
      - templates
      - instances
    tags: jails, zfs

  - name: create template dataset
    community.general.zfs:
      name: "{{ jails_template }}"
      state: present
      extra_zfs_properties:
        readonly: off
    loop:
      - downloads
      - templates
    tags: jails, zfs

  - name: set permissions
    file:
      path: "{{ item }}"
      state: directory
      recurse: no
      owner: root
      group: wheel
      mode: '0775'
    loop:
      - "{{ jails_mount }}"
      - "{{ jails_mount }}/downloads"
      - "{{ jails_mount }}/templates"
      - "{{ jails_mount }}/instances"
    tags: jails, zfs

  # endblock
  when: template_missing
