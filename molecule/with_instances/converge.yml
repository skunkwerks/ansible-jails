---
- name: Converge - full jail lifecycle with instances
  hosts: localhost
  become: true
  vars:
    jails_zpool: zroot
    jails_mount: /jails_test
    # cover the tarball path here, the default scenario covers pkgbase
    jails_base_pkg: false
    jails_patch_template: false
    jails_verify_template: false
    jails_repo: molecule
    jails_repo_config: |
      molecule: {
        # CURRENT and STABLE have no quarterly branch
        url: "https://pkg.FreeBSD.org/${ABI}/{{ 'quarterly' if ansible_facts['distribution_release'] is search('-RELEASE') else 'latest' }}",
        mirror_type: "srv",
        signature_type: "fingerprints",
        fingerprints: "/usr/share/keys/pkg",
        enabled: yes
      }
    jails_list:
      - name: testjail1
        zfs: zroot/jails_test_jailed
        ip4_addr: 'lo0|127.0.0.2/32'
        ip6_addr: 'lo0|::1/128'
        packages:
          - shells/bash
        daemons:
          - syslogd
      - name: testjail2
        hostname: testjail2.example.com
        ip4_addrs:
          - 'lo0|127.0.0.3/32'
          - 'lo0|127.0.0.4/32'
        ip6_addrs:
          - 'lo0|fd00::3/128'
          - 'lo0|fd00::4/128'
      # without addresses, the jail has no IPv4 nor IPv6 networking at all
      - name: testjail3
  pre_tasks:
    - name: Create jailed zfs dataset for testjail1
      community.general.zfs:
        name: zroot/jails_test_jailed
        state: present
        extra_zfs_properties:
          jailed: "on"
          mountpoint: /var/db/molecule
  roles:
    - role: ansible-jails
